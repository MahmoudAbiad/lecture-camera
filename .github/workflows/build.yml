name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report Error on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build.log', 'utf8');
              const lines = log.split('\n');
              log = lines.slice(-80).join('\n');
            } catch(e) {
              log = 'Could not read build.log: ' + e;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Build Log Failure - ' + context.sha.substring(0, 7),
              body: '```\n' + log + '\n```'
            });

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lecture-camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
